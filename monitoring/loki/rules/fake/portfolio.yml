groups:
  - name: portfolio
    interval: 1m
    rules:
      # nginx 5xx spike. `| json status="status"` extracts the status code and
      # `| __error__=""` drops nginx's plain-text error/startup lines that share the
      # stdout stream and aren't JSON.
      - alert: Portfolio5xxSpike
        expr: |
          sum(rate({container="portfolio"} | json status="status" | __error__="" | status >= 500 [5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "portfolio is serving 5xx responses"
          description: "nginx 5xx rate > 0.2/s over the last 5m. Check the portfolio container and upstream reverse proxy."
