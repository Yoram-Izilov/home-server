modules:
  # Probes a public URL end-to-end (reverse proxy + TLS + portfolio container).
  # Follows the apex -> www 301 redirect; treats any 2xx as success.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
