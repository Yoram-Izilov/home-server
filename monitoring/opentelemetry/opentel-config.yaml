receivers:
  otlp:
    protocols:
      # Bind to 0.0.0.0 explicitly. Since collector v0.110 an empty grpc/http block
      # defaults to localhost (loopback inside the container), which makes the receiver
      # unreachable from other containers (e.g. the portfolio nginx OTel exporter, which
      # otherwise fails with "OTel export failure: failed to connect to all addresses").
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
